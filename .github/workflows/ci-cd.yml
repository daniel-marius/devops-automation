name: Python DevOps Automation CI/CD

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    
permissions:
    contents: read
    
jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                enable-cache: true

            - name: Install Python
              run: uv python install 3.15

            - name: Install dependencies
              run: uv sync --locked --all-groups

            - name: Run lint
              run: uv run ruff check .

            - name: Run tests
              run: uv run pytest -v

[project]
name = "devops-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "daniel_marius", email = "danieladam01995@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
devops-automation = "devops_automation:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
